version: 2

project_name: topsrv

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - main: ./cmd/topsrv
    binary: topsrv
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

sboms:
  - artifacts: archive

release:
  # Without this a -rc tag ships as a full release and GitHub marks it "Latest",
  # displacing the last stable one. Agents on the stable channel would then
  # auto-update onto a release candidate. "auto" flags any tag carrying a semver
  # prerelease suffix (-rc.1, -beta.2) as a prerelease, which GitHub never
  # marks as Latest.
  prerelease: auto
