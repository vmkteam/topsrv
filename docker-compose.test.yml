services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD: test
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./testdata/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Certs are pre-generated by scripts/gen-test-certs.sh on the host and
  # mounted read-only — avoids a flaky `apk add openssl` inside the container
  # that used to race the healthcheck.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./testdata/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./testdata/certs/test.pem:/etc/nginx/ssl/test.pem:ro
      - ./testdata/certs/test.key:/etc/nginx/ssl/test.key:ro
      - nginx-json-logs:/var/log/nginx/json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/stub_status || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  angie:
    image: docker.angie.software/angie:minimal
    ports:
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18082:8080"
    volumes:
      - ./testdata/angie.conf:/etc/angie/angie.conf:ro
      - ./testdata/certs/test.pem:/etc/angie/ssl/test.pem:ro
      - ./testdata/certs/test.key:/etc/angie/ssl/test.key:ro
      - angie-json-logs:/var/log/angie/json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-retentionPeriod=1d", "-httpListenAddr=:8428", "-search.latencyOffset=0s"]
    ports:
      - "127.0.0.1:18428:8428"
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-version"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  nginx-json-logs:
  angie-json-logs:
