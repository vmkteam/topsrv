services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD: test
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./testdata/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./testdata/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/stub_status || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  angie:
    image: docker.angie.software/angie:minimal
    ports:
      - "127.0.0.1:18081:80"
      - "127.0.0.1:18082:8080"
    volumes:
      - ./testdata/angie.conf:/etc/angie/angie.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    command: ["-retentionPeriod=1d", "-httpListenAddr=:8428"]
    ports:
      - "127.0.0.1:18428:8428"
    healthcheck:
      test: ["CMD", "/victoria-metrics-prod", "-version"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
