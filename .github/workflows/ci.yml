name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...
        env:
          GOEXPERIMENT: jsonv2

      - name: Vet
        run: go vet ./...
        env:
          GOEXPERIMENT: jsonv2

      # staticcheck-action's own caching is disabled below because it pins
      # actions/cache v4.3.0, which is node20 — a runtime the runners drop in
      # autumn 2026. Upstream has a fix open (dominikh/staticcheck-action#23)
      # but the repo has been dormant since March, so we cache the same
      # directory ourselves on a current version. Same key strategy as upstream:
      # store under a unique key, restore from the newest earlier entry.
      - name: Staticcheck cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/staticcheck
          key: staticcheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: staticcheck-${{ runner.os }}-

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false
          use-cache: false
        env:
          GOEXPERIMENT: jsonv2

      - name: Build
        run: go build -o /dev/null ./cmd/topsrv
        env:
          GOEXPERIMENT: jsonv2

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          args: check

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@v0

      # GORELEASER_CURRENT_TAG pins the release to the tag that was pushed.
      # Left to itself goreleaser picks among the tags pointing at HEAD with
      # `--sort=-version:refname`, and git's versionsort ranks `v0.1.6-rc.2`
      # ABOVE `v0.1.6` unless `versionsort.suffix` is set — it reads the
      # suffix as more refname, not as a semver prerelease. So a final tag
      # placed on the same commit as its last release candidate, the normal
      # case when the rc needed no further fixes, rebuilds the rc instead:
      # every artifact carries the rc version and the upload then fails 422,
      # because the rc's own release already holds those asset names.
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOEXPERIMENT: jsonv2
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
